<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="k8s-workflow-title k8s-workflow-desc" id="k8s-workflow-root">
        <title id="k8s-workflow-title">Kubernetes 使用流程</title>
        <desc id="k8s-workflow-desc">先跑 kubernetes/ssh-init.sh，再跑 kubernetes/k8s-cluster.yaml。不需要可选组件就结束；需要时再打开 NFS、Harbor 或监控。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #k8s-workflow-root { --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #bf4520;
      --font-sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #k8s-workflow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #k8s-workflow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#k8s-workflow-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="k8s-workflow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="k8s-workflow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="960" height="600" fill="#f5f5f5"/>

        <line x1="320" y1="72" x2="320" y2="96" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#k8s-workflow-arrow)"/>
        <line x1="320" y1="148" x2="320" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#k8s-workflow-arrow)"/>
        <line x1="320" y1="224" x2="320" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#k8s-workflow-arrow)"/>
        <line x1="400" y1="296" x2="520" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#k8s-workflow-arrow)"/>
        <line x1="320" y1="344" x2="320" y2="400" stroke="#bf4520" stroke-width="1.4" marker-end="url(#k8s-workflow-arrow-accent)"/>
        <path d="M 640,322 V 368 Q 640,376 632,376 H 324" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        <circle cx="320" cy="376" r="4" fill="#2d3142"/>

        <rect x="332" y="352" width="36" height="16" rx="2" fill="#f5f5f5"/>
        <text x="350" y="364" fill="#bf4520" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">否</text>
        <rect x="436" y="272" width="36" height="16" rx="2" fill="#f5f5f5"/>
        <text x="454" y="284" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">是</text>

        <rect x="240" y="32" width="160" height="40" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="320" y="56" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">开始</text>

        <rect x="200" y="96" width="240" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">检查 SSH</text>
        <text x="320" y="134" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">kubernetes/ssh-init.sh</text>

        <rect x="200" y="172" width="240" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="194" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">部署集群</text>
        <text x="320" y="210" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">kubernetes/k8s-cluster.yaml</text>

        <polygon points="320,248 400,296 320,344 240,296" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">要可选</text>
        <text x="320" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">组件?</text>

        <rect x="520" y="270" width="240" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="640" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">打开可选组件</text>
        <text x="640" y="308" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">k8s_enable_*</text>

        <rect x="220" y="400" width="200" height="48" rx="20" fill="#bf4520" stroke="#bf4520" stroke-width="1.4" fill-opacity="0.08"/>
        <text x="320" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">集群就绪</text>

        <line x1="40" y1="528" x2="920" y2="528" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>
        <rect x="40" y="548" width="28" height="14" rx="7" fill="#2d3142" stroke="#2d3142" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="76" y="560" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">开始 / 结束</text>
        <rect x="196" y="548" width="28" height="14" rx="2" fill="#ffffff" stroke="#2d3142"/>
        <text x="232" y="560" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">步骤</text>
        <polygon points="308,555 322,548 336,555 322,562" fill="#ffffff" stroke="#2d3142"/>
        <text x="348" y="560" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">判断</text>
        <line x1="420" y1="555" x2="452" y2="555" stroke="#bf4520" stroke-width="1.4" marker-end="url(#k8s-workflow-arrow-accent)"/>
        <text x="460" y="560" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">主路径</text>
      </svg>
