<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 468" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="k8s-workflow-title k8s-workflow-desc" id="k8s-workflow-root">
  <title id="k8s-workflow-title">Kubernetes 使用流程</title>
  <desc id="k8s-workflow-desc">先改 inventory/inventory.ini，再跑 kubernetes/ssh-init.sh。不需要可选组件就直接部署 kubernetes/k8s-cluster.yaml；需要时打开 k8s_enable_*。</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@500;600&amp;display=swap');
#k8s-workflow-root { font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; color: #2d3142; }</style>
    <marker id="k8s-workflow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="k8s-workflow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
  </defs>
  <rect width="720" height="468" fill="#f5f5f5"/>

  <line x1="212" y1="68" x2="212" y2="84" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#k8s-workflow-arrow)"/>
  <line x1="212" y1="132" x2="212" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#k8s-workflow-arrow)"/>
  <line x1="212" y1="196" x2="212" y2="212" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#k8s-workflow-arrow)"/>
  <line x1="296" y1="244" x2="368" y2="244" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#k8s-workflow-arrow)"/>
  <line x1="212" y1="276" x2="212" y2="328" stroke="#bf4520" stroke-width="1.4" marker-end="url(#k8s-workflow-arrow-accent)"/>
  <path d="M 478,268 V 300 Q 478,308 470,308 H 216" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
  <circle cx="212" cy="308" r="4" fill="#2d3142"/>
  <line x1="212" y1="376" x2="212" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#k8s-workflow-arrow)"/>

  <rect x="220" y="282" width="36" height="16" rx="2" fill="#f5f5f5"/>
  <text x="238" y="294" fill="#bf4520" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">否</text>
  <rect x="308" y="220" width="36" height="16" rx="2" fill="#f5f5f5"/>
  <text x="326" y="232" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">是</text>

  <rect x="172" y="32" width="80" height="36" rx="18" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
  <text x="212" y="54" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">开始</text>

  <rect x="112" y="84" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="212" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">改主机清单</text>
  <text x="212" y="118" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">inventory/inventory.ini</text>

  <rect x="112" y="148" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="212" y="166" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">检查 SSH</text>
  <text x="212" y="182" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">kubernetes/ssh-init.sh</text>

  <polygon points="212,212 296,244 212,276 128,244" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="212" y="248" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">要可选组件?</text>

  <rect x="368" y="220" width="220" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="478" y="238" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">打开可选组件</text>
  <text x="478" y="254" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">k8s_enable_*</text>

  <rect x="112" y="328" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="212" y="346" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">部署集群</text>
  <text x="212" y="362" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">kubernetes/k8s-cluster.yaml</text>

  <rect x="172" y="392" width="80" height="36" rx="18" fill="#bf4520" stroke="#bf4520" stroke-width="1.4" fill-opacity="0.08"/>
  <text x="212" y="414" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">结束</text>
</svg>
