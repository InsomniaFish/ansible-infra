<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 572" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gpuenv-workflow-title gpuenv-workflow-desc" id="gpuenv-workflow-root">
        <title id="gpuenv-workflow-title">gpuenv 使用流程</title>
        <desc id="gpuenv-workflow-desc">先改 inventory/inventory.ini，再执行 gpuenv/ssh-setup.sh，然后改 gpuenv/vars/deploy.yml。在线直接安装，离线包放至 /opt/packages，然后跑 gpuenv/site.yml，验收 gpuenv/check.yml 可选。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #gpuenv-workflow-root { --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #bf4520;
      --font-sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #gpuenv-workflow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #gpuenv-workflow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#gpuenv-workflow-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="gpuenv-workflow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="gpuenv-workflow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="720" height="572" fill="#f5f5f5"/>

        <line x1="212" y1="68" x2="212" y2="84" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#gpuenv-workflow-arrow)"/>
        <line x1="212" y1="132" x2="212" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#gpuenv-workflow-arrow)"/>
        <line x1="212" y1="196" x2="212" y2="212" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#gpuenv-workflow-arrow)"/>
        <line x1="212" y1="260" x2="212" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#gpuenv-workflow-arrow)"/>
        <line x1="296" y1="308" x2="368" y2="308" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#gpuenv-workflow-arrow)"/>
        <line x1="212" y1="340" x2="212" y2="376" stroke="#bf4520" stroke-width="1.4" marker-end="url(#gpuenv-workflow-arrow-accent)"/>
        <path d="M 478,328 V 362 Q 478,370 470,370 H 216" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        <circle cx="212" cy="370" r="4" fill="#2d3142"/>
        <line x1="212" y1="424" x2="212" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#gpuenv-workflow-arrow)"/>
        <line x1="212" y1="488" x2="212" y2="504" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#gpuenv-workflow-arrow)"/>

        <rect x="220" y="346" width="48" height="16" rx="2" fill="#f5f5f5"/>
        <text x="244" y="358" fill="#bf4520" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">在线</text>
        <rect x="308" y="284" width="48" height="16" rx="2" fill="#f5f5f5"/>
        <text x="332" y="296" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">离线</text>

        <rect x="172" y="32" width="80" height="36" rx="18" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="212" y="54" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">开始</text>

        <rect x="112" y="84" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="212" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">改主机清单</text>
        <text x="212" y="118" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">inventory/inventory.ini</text>

        <rect x="112" y="148" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="212" y="166" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">开启 SSH 免密</text>
        <text x="212" y="182" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">gpuenv/ssh-setup.sh</text>

        <rect x="112" y="212" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="212" y="230" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">改部署清单</text>
        <text x="212" y="246" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">gpuenv/vars/deploy.yml</text>

        <polygon points="212,276 296,308 212,340 128,308" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="212" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">在线安装?</text>

        <rect x="368" y="288" width="220" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="478" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">离线包放至/opt/packages</text>

        <rect x="112" y="376" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="212" y="394" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">执行安装</text>
        <text x="212" y="410" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">gpuenv/site.yml</text>

        <rect x="112" y="440" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="212" y="458" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">验收（可选）</text>
        <text x="212" y="474" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">gpuenv/check.yml</text>

        <rect x="172" y="504" width="80" height="36" rx="18" fill="#bf4520" stroke="#bf4520" stroke-width="1.4" fill-opacity="0.08"/>
        <text x="212" y="526" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">结束</text>
      </svg>
