---
#===============================================================================
# GPU 环境检查 playbook（只读，不做任何修改）
# 检查可安装组件和调优项是否生效，最后列出已安装与未安装。
# Ubuntu 22.04 检查 nvidia_peermem；24.04 及以上检查 DMA-BUF，且不应残留 nvidia_peermem。
# 用法：
#   ansible-playbook -i inventory.ini check.yml                 # 检测所有节点
#   ansible-playbook -i inventory.ini check.yml --limit node01 # 仅检测指定节点
#===============================================================================
- name: 检查 GPU 环境安装与调优是否生效
  hosts: gpu_nodes
  become: yes
  gather_facts: false
  pre_tasks:
    - name: 确保目标机已安装 Python 3
      raw: >
        command -v python3 >/dev/null 2>&1 ||
        (apt-get update && DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y python3)
      changed_when: false
    - name: 收集主机信息
      setup:
  roles:
    - gpuenv_check
