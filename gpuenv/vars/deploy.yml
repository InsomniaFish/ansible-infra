#===============================================================================
# 部署配置清单
#
# 变量按 playbook 安装顺序排列。未写的项用默认值（默认不安装）。
# 优先级：role defaults < vars/gpuenv_repos.yml < 本文件 < 命令行 -e
#
# 安装顺序：
#   1  OFED
#   2  NVIDIA 驱动（含内核模块类型；可在装完后重启）
#   3  CUDA
#   4  fabricmanager（版本须与驱动一致）
#   5  NCCL
#   6  OpenMPI
#   7  nccl-tests
#   8  NVSHMEM（写入 nvidia.conf，需再重启一次才生效）
#   9  nvidia_peermem（22.04 加载并开机持久化；24.04 的同名开关走 DMA-BUF）
#  10  关闭 PCI ACS
#  11  IOMMU（off 与 pt 二选一）
#  12  inotify
#  13  RoCE PFC / ECN（InfiniBand 不需要）
#  14  GDRCopy（依赖 CUDA）
#  15  gpu-burn
#  16  DCGM
#  17  nvidia-container-toolkit
#
# 操作系统差异与选择：
#   本清单只给 Ubuntu 22.04（22.04 ≤ 版本 < 22.10）。24.04 用 ubuntu24.04 分支的 deploy.yml，不要混用。
#   分支决定软件源：本分支 ubuntu2204，24.04 分支 ubuntu2404。在线安装不用改 URL。
#   GPUDirect 用同一个开关 gpuenv_install_peermem。多机 RDMA 建议两边都设 true。
#     22.04：加载 nvidia_peermem，并写入 /etc/modules-load.d/nvidia-peermem.conf。
#     24.04：走内核 DMA-BUF，不加载 nvidia_peermem。不要在 24.04 上 modprobe nvidia_peermem，残留开机配置会导致开机失败。
#   离线包必须带本系统的名字。驱动、CUDA、NCCL 版本可以和 24.04 选同一套：
#     MLNX_OFED 用 *-ubuntu22.04-x86_64.tgz
#     DOCA 用 .../doca/<版本>/ubuntu22.04/x86_64/
#     NVSHMEM 用 nvshmem-local-repo-ubuntu2204-*.deb
#===============================================================================


#===============================================================================
# 当前部署：多机训练（在线）
#===============================================================================

# 1. OFED（必须在 GPU 驱动之前）
gpuenv_install_ofed: true
gpuenv_ofed_flavor: doca_ofed              # mlnx_ofed 或 doca_ofed
gpuenv_ofed_version: "3.2.2"               # doca_ofed 为 DOCA 发行版本
gpuenv_ofed_install_mode: online           # online 或 package
# gpuenv_ofed_package: /opt/packages/MLNX_OFED_LINUX-24.10-1.1.4.0-ubuntu22.04-x86_64.tgz

# 2. NVIDIA 驱动
gpuenv_install_driver: true
gpuenv_driver_version: "580.178.04"
gpuenv_driver_install_mode: online         # online=apt / package=离线 .run
gpuenv_driver_kernel: open                 # open=开源（默认）/ proprietary=闭源
gpuenv_reboot_after_driver: false          # 装完重启以加载内核模块

# 3. CUDA
gpuenv_install_cuda: true

# 4. fabricmanager（版本留空则与驱动一致）
gpuenv_install_fabricmanager: true

# 5. NCCL
gpuenv_install_nccl: true

# 6. OpenMPI
gpuenv_install_openmpi: true

# 7. nccl-tests
gpuenv_install_nccl_tests: true

# 8. NVSHMEM（写入 /etc/modprobe.d/nvidia.conf，需再重启一次）
gpuenv_install_nvshmem: true

# 9. nvidia_peermem（22.04：依赖驱动，加载并写入开机配置）
gpuenv_install_peermem: true

# 10. 关闭 PCI ACS（开机由 systemd 重做）
gpuenv_install_pci_acs: true

# 11. IOMMU（off 与 pt 只能二选一，重启后 /proc/cmdline 才变）
# VMware 客户机不要开：iommu=off 会让 e1000 / USB DMA 失败，虚拟机起不来
# gpuenv_install_iommu: true
# gpuenv_iommu_mode: "off"

# 12. inotify 上限
gpuenv_install_inotify: true

# 13. RoCE PFC / ECN（默认关；InfiniBand 不要开）
# gpuenv_install_pfc: true
# gpuenv_pfc_priorities: "0,0,0,1,0,0,0,0" # 8 个优先级，此例只开优先级 3
# gpuenv_pfc_trust: dscp                   # dscp 或 pcp
# gpuenv_install_ecn: true
# gpuenv_ecn_priority: 3                   # 与 PFC 打开的优先级一致
# gpuenv_roce_ifaces: []                   # 空列表则自动发现 mlx5 网口

# 14. GDRCopy v2.6（依赖 CUDA；加载并持久化 gdrdrv）
gpuenv_install_gdrcopy: true

# 15. gpu-burn
gpuenv_install_gpu_burn: true
gpuenv_gpu_burn_install_mode: online

# 16. DCGM
# gpuenv_install_dcgm: true
# gpuenv_dcgm_install_mode: online

# 17. nvidia-container-toolkit（会重启 docker）
# gpuenv_install_container_toolkit: true
# gpuenv_container_toolkit_install_mode: online


