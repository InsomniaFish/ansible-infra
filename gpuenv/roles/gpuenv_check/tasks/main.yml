---
# 只读检查可安装组件和调优项是否生效，最后列出已安装与未安装。

- name: 检查安装项与调优项是否生效
  environment:
    CHECK_OPENMPI: "{{ gpuenv_openmpi_dir }}/bin/mpirun"
    CHECK_NCCL_TESTS: "{{ gpuenv_nccl_tests_dir }}/build/all_reduce_perf"
    CHECK_GPU_BURN: "{{ gpuenv_gpu_burn_dir }}/gpu_burn"
  shell: |
    python3 - << 'PY'
    import json, os, subprocess

    def run(cmd):
        p = subprocess.run(cmd, shell=True, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, text=True)
        return p.returncode, (p.stdout or "").strip()

    def dpkg_map():
        _, out = run("dpkg-query -W -f='${db:Status-Abbrev}|${Package}|${Version}\\n' 2>/dev/null || true")
        found = {}
        for line in out.splitlines():
            parts = line.split("|", 2)
            if len(parts) != 3:
                continue
            st, name, ver = parts
            if len(st) >= 2 and st[1] == "i":
                found[name] = ver
        return found

    def prefixed(pkgs, prefix):
        return ["%s %s" % (n, v) for n, v in pkgs.items() if n.startswith(prefix)]

    def grub_tokens():
        path = "/etc/default/grub"
        if not os.path.isfile(path):
            return []
        for line in open(path, encoding="utf-8", errors="replace"):
            if line.startswith("GRUB_CMDLINE_LINUX="):
                val = line.split("=", 1)[1].strip().strip("'").strip('"')
                return val.split()
        return []

    def sysctl(key):
        _, out = run("sysctl -n %s" % key)
        return out

    pkgs = dpkg_map()
    items = []

    doca = pkgs.get("doca-ofed", "")
    _, ofed = run("ofed_info -s 2>/dev/null | head -n 1")
    rdma = pkgs.get("rdma-core", "")
    if doca:
        items.append(("ofed", "OFED", True, "doca-ofed %s" % doca))
    elif ofed:
        items.append(("ofed", "OFED", True, ofed))
    elif rdma:
        items.append(("ofed", "OFED", True, "rdma-core %s" % rdma))
    else:
        items.append(("ofed", "OFED", False, ""))

    drv = prefixed(pkgs, "nvidia-driver-") + prefixed(pkgs, "nvidia-dkms-")
    smi_rc, _ = run("nvidia-smi >/dev/null 2>&1")
    if drv or smi_rc == 0:
        detail = drv[0] if drv else "nvidia-smi"
        detail += "，nvidia-smi 正常" if smi_rc == 0 else "，内核模块未加载"
        items.append(("driver", "NVIDIA 驱动", True, detail))
    else:
        items.append(("driver", "NVIDIA 驱动", False, ""))

    nvcc_rc, nvcc = run("/usr/local/cuda/bin/nvcc -V")
    if nvcc_rc == 0:
        lines = [x for x in nvcc.splitlines() if x.strip()]
        items.append(("cuda", "CUDA", True, lines[-1] if lines else ""))
    else:
        items.append(("cuda", "CUDA", False, ""))

    fm = pkgs.get("nvidia-fabricmanager", "")
    if fm:
        _, fm_active = run("systemctl is-active nvidia-fabricmanager 2>/dev/null || true")
        items.append(("fabricmanager", "fabricmanager", True, "%s，服务 %s" % (fm, fm_active or "未知")))
    else:
        items.append(("fabricmanager", "fabricmanager", False, ""))

    nccl = pkgs.get("libnccl2", "")
    items.append(("nccl", "NCCL", bool(nccl), nccl))

    mpirun = os.environ["CHECK_OPENMPI"]
    mpi_rc, mpi_ver = run("%s --version" % mpirun) if os.path.isfile(mpirun) else (1, "")
    if mpi_rc == 0:
        items.append(("openmpi", "OpenMPI", True, mpi_ver.splitlines()[0]))
    else:
        items.append(("openmpi", "OpenMPI", False, ""))

    nccl_tests = os.environ["CHECK_NCCL_TESTS"]
    items.append(("nccl_tests", "nccl-tests", os.path.isfile(nccl_tests), nccl_tests if os.path.isfile(nccl_tests) else ""))

    nvshmem = prefixed(pkgs, "nvshmem-cuda-")
    conf_path = "/etc/modprobe.d/nvidia.conf"
    conf_ok = False
    if os.path.isfile(conf_path):
        conf_ok = "NVreg_EnableStreamMemOPs=1" in open(conf_path, encoding="utf-8", errors="replace").read()
    if nvshmem and conf_ok:
        params_rc, _ = run("grep -qE '^EnableStreamMemOPs: 1' /proc/driver/nvidia/params")
        detail = nvshmem[0]
        if params_rc != 0:
            detail += "，驱动参数重启后生效"
        items.append(("nvshmem", "NVSHMEM", True, detail))
    else:
        items.append(("nvshmem", "NVSHMEM", False, ""))

    os_ver = ""
    if os.path.isfile("/etc/os-release"):
        for line in open("/etc/os-release", encoding="utf-8", errors="replace"):
            if line.startswith("VERSION_ID="):
                os_ver = line.split("=", 1)[1].strip().strip('"').strip("'")
    os_nums = []
    for part in os_ver.split("."):
        num = ""
        for ch in part:
            if ch.isdigit():
                num += ch
            else:
                break
        os_nums.append(int(num) if num else 0)
    while len(os_nums) < 2:
        os_nums.append(0)
    use_dmabuf = os_nums[0] > 24 or (os_nums[0] == 24 and os_nums[1] >= 4)
    peer_rc, _ = run("lsmod | grep -q '^nvidia_peermem'")
    peer_loaded = peer_rc == 0
    peer_conf = "/etc/modules-load.d/nvidia-peermem.conf"
    peer_persist = False
    if os.path.isfile(peer_conf):
        peer_persist = any(line.strip() == "nvidia_peermem" for line in open(peer_conf, encoding="utf-8", errors="replace"))
    if use_dmabuf:
        nvidia_rc, _ = run("modinfo nvidia >/dev/null 2>&1")
        if nvidia_rc == 0 and not peer_loaded and not peer_persist:
            items.append(("peermem", "DMA-BUF", True, "内核 DMA-BUF，未加载 nvidia_peermem"))
        elif nvidia_rc != 0:
            items.append(("peermem", "DMA-BUF", False, "驱动未安装"))
        elif peer_loaded and peer_persist:
            items.append(("peermem", "DMA-BUF", False, "仍加载并持久化 nvidia_peermem"))
        elif peer_loaded:
            items.append(("peermem", "DMA-BUF", False, "仍加载 nvidia_peermem"))
        else:
            items.append(("peermem", "DMA-BUF", False, "仍有 nvidia-peermem.conf"))
    elif peer_loaded and peer_persist:
        items.append(("peermem", "nvidia_peermem", True, "已加载，开机持久化"))
    elif peer_loaded:
        items.append(("peermem", "nvidia_peermem", False, "已加载但未持久化"))
    elif peer_persist:
        items.append(("peermem", "nvidia_peermem", False, "已持久化但未加载"))
    else:
        items.append(("peermem", "nvidia_peermem", False, ""))

    _, acs_enabled = run("systemctl is-enabled disable-pcie-acs 2>/dev/null || true")
    acs_rc, _ = run("lspci -vvv 2>/dev/null | grep ACSCtl | grep -q 'SrcValid+'")
    acs_closed = acs_rc != 0
    if acs_enabled == "enabled" and acs_closed:
        items.append(("pci_acs", "PCI ACS", True, "已关闭，开机服务已启用"))
    elif acs_enabled == "enabled":
        items.append(("pci_acs", "PCI ACS", False, "仍有 SrcValid+"))
    else:
        items.append(("pci_acs", "PCI ACS", False, ""))

    tokens = grub_tokens()
    off = (("intel_iommu=off" in tokens) or ("amd_iommu=off" in tokens)) and ("iommu=off" in tokens) and ("iommu=pt" not in tokens)
    pt = (("intel_iommu=on" in tokens) or ("amd_iommu=on" in tokens)) and ("iommu=pt" in tokens) and ("iommu=off" not in tokens)
    if off or pt:
        mode = "off" if off else "pt"
        _, cmdline = run("cat /proc/cmdline")
        detail = "GRUB iommu=%s" % mode
        if ("iommu=%s" % mode) not in cmdline.split():
            detail += "，重启后生效"
        items.append(("iommu", "IOMMU", True, detail))
    else:
        items.append(("iommu", "IOMMU", False, ""))

    watches = {
        "fs.inotify.max_user_watches": "1048576",
        "fs.inotify.max_user_instances": "8192",
        "fs.inotify.max_queued_events": "65536",
    }
    inotify_ok = all(sysctl(k) == v for k, v in watches.items())
    items.append(("inotify", "inotify", inotify_ok, "1048576 / 8192 / 65536" if inotify_ok else ""))

    script = "/usr/local/sbin/roce-qos.sh"
    text = open(script, encoding="utf-8", errors="replace").read() if os.path.isfile(script) else ""
    _, roce_active = run("systemctl is-active roce-qos 2>/dev/null || true")
    roce_ok = roce_active == "active"
    if "DO_PFC=1" in text and roce_ok:
        items.append(("pfc", "PFC", True, "roce-qos 已生效"))
    elif "DO_PFC=1" in text:
        items.append(("pfc", "PFC", False, "已配置但 roce-qos 未成功"))
    else:
        items.append(("pfc", "PFC", False, ""))
    if "DO_ECN=1" in text and roce_ok:
        items.append(("ecn", "ECN", True, "roce-qos 已生效"))
    elif "DO_ECN=1" in text:
        items.append(("ecn", "ECN", False, "已配置但 roce-qos 未成功"))
    else:
        items.append(("ecn", "ECN", False, ""))

    gdr = pkgs.get("gdrdrv-dkms", "")
    gpu_rc, _ = run("nvidia-smi -L >/dev/null 2>&1")
    gdr_rc, _ = run("lsmod | grep -q '^gdrdrv'")
    gdr_conf = "/etc/modules-load.d/gdrdrv.conf"
    gdr_persist = False
    if os.path.isfile(gdr_conf):
        gdr_persist = any(line.strip() == "gdrdrv" for line in open(gdr_conf, encoding="utf-8", errors="replace"))
    if gdr and gpu_rc != 0:
        items.append(("gdrcopy", "GDRCopy", True, "%s，无 GPU 未加载 gdrdrv" % gdr))
    elif gdr and gdr_rc == 0 and gdr_persist:
        items.append(("gdrcopy", "GDRCopy", True, "%s，gdrdrv 已加载" % gdr))
    elif gdr:
        items.append(("gdrcopy", "GDRCopy", False, "已安装包但 gdrdrv 未加载或未持久化"))
    else:
        items.append(("gdrcopy", "GDRCopy", False, ""))

    burn = os.environ["CHECK_GPU_BURN"]
    items.append(("gpu_burn", "gpu-burn", os.path.isfile(burn), burn if os.path.isfile(burn) else ""))

    dcgm = pkgs.get("datacenter-gpu-manager", "")
    if dcgm:
        _, dcgm_active = run("systemctl is-active nvidia-dcgm 2>/dev/null || true")
        items.append(("dcgm", "DCGM", True, "%s，服务 %s" % (dcgm, dcgm_active or "未知")))
    else:
        items.append(("dcgm", "DCGM", False, ""))

    ctk = pkgs.get("nvidia-container-toolkit", "")
    items.append(("container_toolkit", "nvidia-container-toolkit", bool(ctk), ctk))

    print(json.dumps([
        {"comp": c, "name": n, "installed": ok, "detail": d}
        for c, n, ok, d in items
    ], ensure_ascii=False))
    PY
  args:
    executable: /bin/bash
  register: check_raw
  changed_when: false

- name: 解析检查结果
  set_fact:
    check_summary: "{{ check_raw.stdout | from_json }}"
    check_lines: []

- name: 生成逐项结果
  set_fact:
    check_lines: >-
      {{ check_lines + [
           item.name ~ '：' ~ ('已安装' if item.installed else '未安装')
           ~ (('  ' ~ item.detail) if item.detail else '')
         ] }}
  loop: "{{ check_summary }}"
  loop_control:
    label: "{{ item.name }}"

- name: 汇总已安装与未安装
  set_fact:
    check_installed: "{{ check_summary | selectattr('installed') | list }}"
    check_missing: "{{ check_summary | rejectattr('installed') | list }}"

- name: 列出已安装和未安装
  debug:
    msg: >-
      {{
        ['主机: ' ~ inventory_hostname ~ ' (' ~ ansible_distribution ~ ' ' ~ ansible_distribution_version ~ ')']
        + check_lines
        + [
          '已安装（' ~ (check_installed | length | string) ~ '）: '
          ~ ((check_installed | map(attribute='name') | list | join('、')) if (check_installed | length) > 0 else '无'),
          '未安装（' ~ (check_missing | length | string) ~ '）: '
          ~ ((check_missing | map(attribute='name') | list | join('、')) if (check_missing | length) > 0 else '无')
        ]
      }}
