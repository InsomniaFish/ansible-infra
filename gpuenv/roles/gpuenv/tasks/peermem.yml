# GPUDirect RDMA（Ubuntu 24.04）
# 内核 6.8 起由 DMA-BUF 提供，不再加载 nvidia_peermem。
# 残留 /etc/modules-load.d/nvidia-peermem.conf 会在开机时因模块不存在而失败。
# 启用方式：-e gpuenv_install_peermem=true

- name: 检查 NVIDIA 驱动模块是否可用
  shell: modinfo nvidia >/dev/null 2>&1 && echo yes || echo no
  register: nvidia_mod_check
  changed_when: false
  tags: [gpuenv, peermem]

- name: 驱动未安装时跳过 GPUDirect 配置
  debug:
    msg: "NVIDIA 驱动未安装，跳过 GPUDirect RDMA 配置（安装驱动后重新运行即可）"
  when: nvidia_mod_check.stdout | trim != 'yes'
  tags: [gpuenv, peermem]

- name: 移除 nvidia_peermem 开机加载配置
  file:
    path: /etc/modules-load.d/nvidia-peermem.conf
    state: absent
  when: nvidia_mod_check.stdout | trim == 'yes'
  tags: [gpuenv, peermem]

- name: 卸载已加载的 nvidia_peermem
  modprobe:
    name: nvidia_peermem
    state: absent
  failed_when: false
  when: nvidia_mod_check.stdout | trim == 'yes'
  tags: [gpuenv, peermem]

- name: GPUDirect RDMA 结果提示
  debug:
    msg: "Ubuntu 24.04 使用内核 DMA-BUF 提供 GPUDirect RDMA，已跳过 nvidia_peermem"
  when: nvidia_mod_check.stdout | trim == 'yes'
  tags: [gpuenv, peermem]
