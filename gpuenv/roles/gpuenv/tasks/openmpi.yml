# 可选组件：OpenMPI
# 启用方式：gpuenv_install_openmpi=true
#   gpuenv_openmpi_install_mode  online=URL / package=离线源码包

- name: 安装 OpenMPI 编译依赖

  apt:
    name:
      - build-essential
      - libibverbs-dev
    state: present
  failed_when: false
  tags: [gpuenv, openmpi]

- name: 检查 OpenMPI 是否已编译安装

  stat:
    path: /usr/local/openmpi/bin/mpirun
  register: openmpi_bin
  tags: [gpuenv, openmpi]

- name: OpenMPI 已安装，跳过

  debug:
    msg: "OpenMPI 已安装 (/usr/local/openmpi)，跳过"
  when: not gpuenv_force and openmpi_bin.stat.exists
  tags: [gpuenv, openmpi]

- name: package 模式校验 OpenMPI 安装包参数
  fail:
    msg: >-
      gpuenv_openmpi_install_mode=package 但未提供安装包，请通过
      gpuenv_openmpi_package=<本地 openmpi-x.y.z.tar.gz 路径或离线包 URL> 指定
  when:
    - gpuenv_openmpi_install_mode == 'package'
    - gpuenv_openmpi_package | length == 0
  tags: [gpuenv, openmpi]

- name: 删除无效的 OpenMPI 源码包（镜像页被存成 tar.gz 时重新下载）
  shell: |
    f="{{ gpuenv_pkg_dir }}/openmpi-{{ gpuenv_openmpi_version }}.tar.gz"
    if [ -f "$f" ] && ! gzip -t "$f" >/dev/null 2>&1; then
      rm -f "$f"
      echo removed
    fi
  register: openmpi_bad_pkg
  changed_when: "'removed' in openmpi_bad_pkg.stdout"
  when:
    - gpuenv_openmpi_install_mode == 'online'
    - gpuenv_force or not openmpi_bin.stat.exists
  tags: [gpuenv, openmpi]

- name: 下载 OpenMPI 源码（online 模式，URL 直链）
  get_url:
    url: "{{ gpuenv_openmpi_url }}"
    dest: "{{ gpuenv_pkg_dir }}/openmpi-{{ gpuenv_openmpi_version }}.tar.gz"
    mode: '0644'
  when:
    - gpuenv_openmpi_install_mode == 'online'
    - gpuenv_force or not openmpi_bin.stat.exists
  tags: [gpuenv, openmpi]

- name: 下载离线 OpenMPI 源码包（package 模式且离线地址为 URL）
  get_url:
    url: "{{ gpuenv_openmpi_package }}"
    dest: "{{ gpuenv_pkg_dir }}/openmpi-{{ gpuenv_openmpi_version }}.tar.gz"
    mode: '0644'
  when:
    - gpuenv_openmpi_install_mode == 'package'
    - gpuenv_openmpi_package is match('^https?://')
    - gpuenv_force or not openmpi_bin.stat.exists
  tags: [gpuenv, openmpi]

- name: 拷贝本地 OpenMPI 源码包到安装包目录（package 模式且离线地址为本地路径）
  copy:
    src: "{{ gpuenv_openmpi_package }}"
    dest: "{{ gpuenv_pkg_dir }}/openmpi-{{ gpuenv_openmpi_version }}.tar.gz"
    mode: '0644'
  when:
    - gpuenv_openmpi_install_mode == 'package'
    - gpuenv_openmpi_package is not match('^https?://')
    - gpuenv_force or not openmpi_bin.stat.exists
  tags: [gpuenv, openmpi]

- name: 解压 OpenMPI 源码（到构建目录）

  unarchive:
    src: "{{ gpuenv_pkg_dir }}/openmpi-{{ gpuenv_openmpi_version }}.tar.gz"
    dest: "{{ gpuenv_build_dir }}"
    remote_src: yes
  when: gpuenv_force or not openmpi_bin.stat.exists
  tags: [gpuenv, openmpi]

- name: 配置 OpenMPI 编译（安装到 /usr/local/openmpi）

  command: ./configure --prefix=/usr/local/openmpi
  args:
    chdir: "{{ gpuenv_openmpi_src_dir }}"
    creates: "{{ gpuenv_openmpi_src_dir }}/Makefile"
  when: gpuenv_force or not openmpi_bin.stat.exists
  tags: [gpuenv, openmpi]

- name: 编译 OpenMPI

  command: make -j {{ ansible_processor_vcpus | default(4) }}
  args:
    chdir: "{{ gpuenv_openmpi_src_dir }}"
  when: gpuenv_force or not openmpi_bin.stat.exists
  tags: [gpuenv, openmpi]

- name: 安装 OpenMPI

  command: make install
  args:
    chdir: "{{ gpuenv_openmpi_src_dir }}"
  when: gpuenv_force or not openmpi_bin.stat.exists
  tags: [gpuenv, openmpi]

- name: 配置 OpenMPI 环境变量

  copy:
    dest: /etc/profile.d/openmpi.sh
    mode: '0644'
    content: |
      export PATH=/usr/local/openmpi/bin:$PATH
      export LD_LIBRARY_PATH=/usr/local/openmpi/lib:$LD_LIBRARY_PATH
  tags: [gpuenv, openmpi]

# 注意：编译完成后保留 OpenMPI 源码包与源码目录，不做删除
