---
# 前置检查：确认目标为 Ubuntu 22.04，并显示本次安装计划

- name: 确认目标系统为 Ubuntu 22.04
  assert:
    that:
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_version is version('22.04', '>=')
      - ansible_distribution_version is version('22.10', '<')
    fail_msg: "本分支仅支持 Ubuntu 22.04，当前为 {{ ansible_distribution }} {{ ansible_distribution_version }}"
    success_msg: "系统检查通过: {{ ansible_distribution }} {{ ansible_distribution_version }}"

- name: 显示安装计划
  debug:
    msg:
      - "本次启用的组件（未列出的组件默认不安装）："
      - "  OFED              : {{ gpuenv_install_ofed }}{{ '（模式: ' + gpuenv_ofed_install_mode + '）' if gpuenv_install_ofed else '' }}"
      - "  GPU 驱动          : {{ gpuenv_install_driver }}{{ '（模式: ' + gpuenv_driver_install_mode + '，版本: ' + gpuenv_driver_version + '，内核模块: ' + gpuenv_driver_kernel + '）' if gpuenv_install_driver else '' }}"
      - "  nvidia_peermem    : {{ gpuenv_install_peermem }}（加载并开机持久化）"
      - "  关闭 PCI ACS      : {{ gpuenv_install_pci_acs }}"
      - "  IOMMU             : {{ gpuenv_install_iommu }}{{ '（' + (gpuenv_iommu_mode | string) + '）' if gpuenv_install_iommu else '' }}"
      - "  inotify           : {{ gpuenv_install_inotify }}"
      - "  PFC               : {{ gpuenv_install_pfc }}{{ '（' + gpuenv_pfc_priorities + '，trust ' + gpuenv_pfc_trust + '）' if gpuenv_install_pfc else '' }}"
      - "  ECN NP/RP         : {{ gpuenv_install_ecn }}{{ '（优先级 ' + (gpuenv_ecn_priority | string) + '）' if gpuenv_install_ecn else '' }}"
      - "  CUDA Toolkit      : {{ gpuenv_install_cuda }}{{ '（模式: ' + gpuenv_cuda_install_mode + '，版本: ' + gpuenv_cuda_version + '）' if gpuenv_install_cuda else '' }}"
      - "  fabricmanager     : {{ gpuenv_install_fabricmanager }}{{ '（模式: ' + gpuenv_fm_install_mode + '，版本: ' + (gpuenv_fm_version if gpuenv_fm_version | length > 0 else gpuenv_driver_version) + '）' if gpuenv_install_fabricmanager else '' }}"
      - "  gpu-burn          : {{ gpuenv_install_gpu_burn }}{{ '（模式: ' + gpuenv_gpu_burn_install_mode + '）' if gpuenv_install_gpu_burn else '' }}"
      - "  NCCL              : {{ gpuenv_install_nccl }}{{ '（模式: ' + gpuenv_nccl_install_mode + '，版本: ' + gpuenv_nccl_version + '）' if gpuenv_install_nccl else '' }}"
      - "  OpenMPI           : {{ gpuenv_install_openmpi }}{{ '（模式: ' + gpuenv_openmpi_install_mode + '，版本: ' + gpuenv_openmpi_version + '）' if gpuenv_install_openmpi else '' }}"
      - "  nccl-tests        : {{ gpuenv_install_nccl_tests }}{{ '（模式: ' + gpuenv_nccl_tests_install_mode + '）' if gpuenv_install_nccl_tests else '' }}"
      - "  DCGM              : {{ gpuenv_install_dcgm }}{{ '（模式: ' + gpuenv_dcgm_install_mode + '）' if gpuenv_install_dcgm else '' }}"
      - "  container-toolkit : {{ gpuenv_install_container_toolkit }}{{ '（模式: ' + gpuenv_container_toolkit_install_mode + '）' if gpuenv_install_container_toolkit else '' }}"
      - "  NVSHMEM           : {{ gpuenv_install_nvshmem }}{{ '（模式: ' + gpuenv_nvshmem_install_mode + '，版本: ' + gpuenv_nvshmem_version + '）' if gpuenv_install_nvshmem else '' }}"
      - "  GDRCopy           : {{ gpuenv_install_gdrcopy }}{{ '（' + gpuenv_gdrcopy_version + '，gdrdrv）' if gpuenv_install_gdrcopy else '' }}"
      - "强制重装: {{ gpuenv_force }}"
