---
- name: Read cluster name from kubectl config
  when: not ansible_check_mode
  ansible.builtin.command: kubectl config view --minify -o jsonpath='{.clusters[0].name}'
  register: prometheus_k8s_cluster_name_from_kubectl
  changed_when: false
  failed_when: false

- name: Set alert cluster name for templates
  ansible.builtin.set_fact:
    prometheus_alert_cluster_name: >-
      {{
        (prometheus_alert_cluster_name | default('') | trim)
        if (prometheus_alert_cluster_name | default('') | trim) != ''
        else (
          (prometheus_k8s_cluster_name_from_kubectl.stdout | default('') | trim)
          if (not ansible_check_mode and (prometheus_k8s_cluster_name_from_kubectl.stdout | default('') | trim) != '')
          else 'kubernetes'
        )
      }}

- name: Render monitoring stack manifest
  ansible.builtin.template:
    src: monitoring-stack.yaml.j2
    dest: /root/monitoring-stack.yaml
    owner: root
    group: root
    mode: "0644"

- name: Apply monitoring stack manifest
  when: not ansible_check_mode
  ansible.builtin.command: "kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f /root/monitoring-stack.yaml --validate=false"
  register: monitoring_apply
  changed_when: "'created' in monitoring_apply.stdout or 'configured' in monitoring_apply.stdout"

- name: Restart Prometheus to reload config
  when: not ansible_check_mode
  ansible.builtin.command: "kubectl --kubeconfig /etc/kubernetes/admin.conf -n {{ monitoring_namespace }} rollout restart deploy/{{ prometheus_name }}"
  changed_when: false

- name: Restart Alertmanager to reload config
  when: not ansible_check_mode
  ansible.builtin.command: "kubectl --kubeconfig /etc/kubernetes/admin.conf -n {{ monitoring_namespace }} rollout restart deploy/{{ alertmanager_name }}"
  changed_when: false

- name: Wait for Prometheus deployment rollout
  when: not ansible_check_mode
  ansible.builtin.command: "kubectl --kubeconfig /etc/kubernetes/admin.conf -n {{ monitoring_namespace }} rollout status deploy/{{ prometheus_name }} --timeout=300s"
  changed_when: false

- name: Wait for Alertmanager deployment rollout
  when: not ansible_check_mode
  ansible.builtin.command: "kubectl --kubeconfig /etc/kubernetes/admin.conf -n {{ monitoring_namespace }} rollout status deploy/{{ alertmanager_name }} --timeout=300s"
  changed_when: false

- name: Wait for Grafana deployment rollout
  when: not ansible_check_mode
  ansible.builtin.command: "kubectl --kubeconfig /etc/kubernetes/admin.conf -n {{ monitoring_namespace }} rollout status deploy/{{ grafana_name }} --timeout=300s"
  changed_when: false

- name: Wait for PrometheusAlert deployment rollout
  when:
    - not ansible_check_mode
    - prometheusalert_enable | bool
  ansible.builtin.command: "kubectl --kubeconfig /etc/kubernetes/admin.conf -n {{ monitoring_namespace }} rollout status deploy/{{ prometheusalert_name }} --timeout=300s"
  changed_when: false

- name: Render PrometheusAlert feishu template file
  when:
    - not ansible_check_mode
    - prometheusalert_enable | bool
  ansible.builtin.template:
    src: prometheusalert-feishu.tpl.j2
    dest: /root/prometheusalert-feishu.tpl
    mode: "0644"

- name: Install fixed PrometheusAlert feishu template
  when:
    - not ansible_check_mode
    - prometheusalert_enable | bool
  ansible.builtin.shell: |
    set -euo pipefail
    POD="$(kubectl --kubeconfig /etc/kubernetes/admin.conf -n {{ monitoring_namespace }} get pod -l app={{ prometheusalert_name }} -o jsonpath='{.items[0].metadata.name}')"
    kubectl --kubeconfig /etc/kubernetes/admin.conf -n {{ monitoring_namespace }} cp /root/prometheusalert-feishu.tpl "${POD}:/tmp/prometheus-fs.tpl"
    kubectl --kubeconfig /etc/kubernetes/admin.conf -n {{ monitoring_namespace }} exec "${POD}" -- \
      sqlite3 /app/db/PrometheusAlertDB.db "UPDATE prometheus_alert_d_b SET tpl=readfile('/tmp/prometheus-fs.tpl') WHERE tplname='{{ prometheusalert_feishu_tpl_name }}';"
  args:
    executable: /bin/bash
  changed_when: true

- name: Wait for kube-state-metrics deployment rollout
  when: not ansible_check_mode
  ansible.builtin.command: "kubectl --kubeconfig /etc/kubernetes/admin.conf -n {{ monitoring_namespace }} rollout status deploy/{{ kube_state_metrics_name }} --timeout=300s"
  changed_when: false

- name: Wait for node-exporter daemonset rollout
  when: not ansible_check_mode
  ansible.builtin.command: "kubectl --kubeconfig /etc/kubernetes/admin.conf -n {{ monitoring_namespace }} rollout status ds/{{ node_exporter_name }} --timeout=300s"
  changed_when: false
