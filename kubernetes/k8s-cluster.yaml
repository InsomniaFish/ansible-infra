- name: Install prerequisites on all nodes (OS tuning + Docker + kubeadm/kubelet/kubectl + cri-dockerd)
  hosts: k8s_cluster
  become: true
  gather_facts: true
  roles:
    - role: k8s_init

- name: Setup NFS server/client (optional)
  hosts: k8s_cluster
  become: true
  gather_facts: true
  roles:
    - role: k8s_nfs
      when: (k8s_enable_nfs | default(false)) | bool

- name: Install Harbor on master01 (optional)
  hosts: k8s_master
  become: true
  gather_facts: true
  roles:
    - role: k8s_harbor
      when:
        - (k8s_enable_harbor | default(false)) | bool
        - inventory_hostname == k8s_harbor_target_host

- name: Initialize control-plane and install Calico
  hosts: k8s_master
  become: true
  gather_facts: false
  tasks:
    - name: Run kubeadm init + apply Calico + generate join command
      ansible.builtin.import_role:
        name: k8s_kubeadm
        tasks_from: master.yml

- name: Join worker nodes
  hosts: k8s_nodes
  become: true
  gather_facts: false
  vars:
    k8s_master_host: "{{ groups['k8s_master'][0] }}"
    k8s_join_command_from_master: "{{ hostvars[k8s_master_host]['k8s_join_command'] | default('', true) }}"
  tasks:
    - name: Skip join in check mode
      when: ansible_check_mode
      ansible.builtin.debug:
        msg: "Check mode: skipping kubeadm join on worker nodes."

    - name: Ensure join command is present
      when: not ansible_check_mode
      ansible.builtin.assert:
        that:
          - k8s_join_command_from_master is defined
          - (k8s_join_command_from_master | length) > 0
        fail_msg: "Join command not available. Ensure the control-plane play ran successfully."

    - name: Join nodes to the cluster
      when: not ansible_check_mode
      ansible.builtin.import_role:
        name: k8s_kubeadm
        tasks_from: nodes.yml

- name: Install Wireshark + WireMCP on all nodes (optional)
  hosts: k8s_cluster
  become: true
  gather_facts: true
  roles:
    - role: k8s_install_wireshark
      when: (k8s_enable_wireshark | default(false)) | bool

- name: Configure NFS dynamic provisioner (optional)
  hosts: k8s_master
  become: true
  gather_facts: false
  tasks:
    - name: Apply NFS provisioner manifest
      when: (k8s_enable_nfs | default(false)) | bool
      ansible.builtin.import_role:
        name: k8s_nfs
        tasks_from: provisioner.yml

- name: Install metrics-server (optional)
  hosts: k8s_master
  become: true
  gather_facts: false
  roles:
    - role: k8s_metrics_server
      when: (k8s_enable_metrics_server | default(false)) | bool

- name: Install monitoring stack (optional)
  hosts: k8s_master
  become: true
  gather_facts: false
  roles:
    - role: k8s_prometheus
      when: (k8s_enable_prometheus | default(false)) | bool


